spring.profiles.active=local
spring.application.name=docuinsight
spring.datasource.url=jdbc:postgresql://localhost:5433/docuInsight_db
spring.datasource.username=postgres
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.port=8080
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.secret=${jwt.secret}
jwt.expiration=86400000

groq.api.key=${groq.api.key}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b
groq.vision.model=qwen/qwen3.8-27b
llm.provider=groqx

app.cors.allowed-origins=http://localhost:5173

spring.ai.openai.api-key=${groq.api.key}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=${groq.api.model}
spring.ai.openai.chat.temperature=0.3
spring.ai.openai.chat.max-tokens=4096
spring.ai.openai.timeout=90s
spring.ai.openai.max-retries=2

# --- Embeddings + vector store
spring.ai.model.embedding=transformers
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE