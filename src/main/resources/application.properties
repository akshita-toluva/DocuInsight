spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.application.name=docuinsight

# --- Database----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/docuInsight_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=8080
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# --- Groq ---
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b
groq.vision.model=qwen/qwen3.8-27b

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Spring AI chat (Groq via OpenAI-compatible API) ----
spring.ai.openai.api-key=${groq.api.key}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=${groq.api.model}
spring.ai.openai.chat.temperature=0.3
spring.ai.openai.chat.max-tokens=4096
spring.ai.openai.timeout=90s
spring.ai.openai.max-retries=2

# --- Embeddings + vector store ----
spring.ai.model.embedding=none
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

app.embedding.model-dir=${EMBEDDING_MODEL_DIR:D:/PROJECT_2026/model-cache/all-MiniLM-L6-v2}
app.embedding.self-check=${EMBEDDING_SELF_CHECK:false}

# --- Daily limits per user ---
app.limits.reports-per-day=${REPORTS_PER_DAY:5}
app.limits.questions-per-day=${QUESTIONS_PER_DAY:30}

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}